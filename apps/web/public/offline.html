<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12161d" />
    <title>Sway is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #f4f5f7; color: #1d2129; display: grid; margin: 0; min-height: 100dvh; padding: 24px; }
      main { margin: auto; max-width: 420px; text-align: center; }
      .icon { align-items: center; background: #2b6cff; border-radius: 24px; color: #fff; display: inline-flex; font-size: 48px; font-weight: 800; height: 96px; justify-content: center; width: 96px; }
      h1 { font-size: 1.75rem; letter-spacing: -0.03em; margin: 24px 0 8px; }
      p { color: #667085; line-height: 1.55; margin: 0; }
      button { background: #2b6cff; border: 0; border-radius: 10px; color: #fff; cursor: pointer; font: inherit; font-weight: 700; margin-top: 24px; min-height: 44px; padding: 0 20px; }
      button:focus-visible { outline: 3px solid #8fb4ff; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: #12161d; color: #eef2f7; }
        p { color: #a7b0be; }
      }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" class="icon">S</div>
      <h1>You’re offline</h1>
      <p>Sway needs an internet connection to load and change your tasks. Reconnect, then try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
